<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Caveat";
        src: url("assets/fonts/caveat-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Permanent Marker";
        src: url("assets/fonts/permanent-marker-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      :root {
        --kraft: #c49a6b;
        --kraft-dark: #9c7247;
        --cream: #f3e8d2;
        --ink: #2a1c14;
        --terra: #b4502b;
        --gold: #d9a441;
        --night: #2b2236;
        --gray: #b9b2a8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--kraft);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--kraft);
        font-family: "Archivo Black", sans-serif;
        color: var(--ink);
      }
      .layer {
        position: absolute;
        inset: 0;
      }

      /* ---------- background collage ---------- */
      #bg-fibers {
        position: absolute;
        inset: 0;
        filter: url(#grain);
        mix-blend-mode: multiply;
        opacity: 0.55;
      }
      #halo {
        position: absolute;
        left: 230px;
        top: 560px;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #f4c45f 0%, #e5a243 55%, #c9782f 100%);
        filter: url(#deckle);
      }
      .sheet {
        position: absolute;
        filter: drop-shadow(0 6px 10px rgba(50, 28, 10, 0.35));
      }
      .sheet > .fill {
        position: absolute;
        inset: 0;
        filter: url(#deckle);
      }
      .sheet > .fill > div {
        position: absolute;
        inset: 0;
      }
      #sheet-cream {
        left: 40px;
        top: 1060px;
        width: 1000px;
        height: 900px;
      }
      #sheet-terra {
        left: -60px;
        top: 1360px;
        width: 520px;
        height: 200px;
      }
      #sheet-night {
        left: 700px;
        top: 1250px;
        width: 460px;
        height: 170px;
      }
      .tape {
        position: absolute;
        width: 190px;
        height: 54px;
        background: rgba(245, 226, 170, 0.78);
        border-left: 3px dashed rgba(140, 110, 60, 0.25);
        border-right: 3px dashed rgba(140, 110, 60, 0.25);
        box-shadow: 0 3px 6px rgba(40, 20, 5, 0.18);
      }
      .star {
        position: absolute;
        width: 70px;
        height: 70px;
      }
      .star svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ---------- subject ---------- */
      #her-wrap {
        position: absolute;
        left: 108px;
        top: 384px;
        width: 864px;
        height: 1536px;
        filter: drop-shadow(5px 0 0 #fffaf0) drop-shadow(-5px 0 0 #fffaf0)
          drop-shadow(0 5px 0 #fffaf0) drop-shadow(0 -5px 0 #fffaf0)
          drop-shadow(0 22px 26px rgba(40, 20, 5, 0.4));
      }
      #her {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ---------- scraps (torn paper labels) ---------- */
      .scrap {
        position: absolute;
        opacity: 0;
        filter: drop-shadow(0 8px 10px rgba(40, 20, 5, 0.38));
      }
      .scrap > .paper {
        position: absolute;
        inset: 0;
        filter: url(#deckle);
      }
      .scrap > .paper > div {
        position: absolute;
        inset: 0;
        background: var(--p, var(--cream));
      }
      .scrap > .txt {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1;
      }
      .scrap .tape {
        z-index: 2;
      }
      .hand {
        font-family: "Caveat", cursive;
        font-weight: 700;
      }
      .marker {
        font-family: "Permanent Marker", cursive;
      }
      .mono {
        font-family: "Space Mono", monospace;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* ransom title */
      #title {
        position: absolute;
        left: 0;
        top: 170px;
        width: 1080px;
        height: 420px;
      }
      .rline {
        position: absolute;
        left: 0;
        width: 1080px;
        display: flex;
        justify-content: center;
        gap: 6px;
      }
      #rline-a {
        top: 0;
      }
      #rline-b {
        top: 150px;
      }
      .rl {
        display: block;
        opacity: 0;
        padding: 6px 10px 2px;
        line-height: 1;
        box-shadow: 0 5px 8px rgba(40, 20, 5, 0.35);
      }
      #rline-a .rl {
        font-size: 80px;
      }
      #rline-b .rl {
        font-size: 128px;
        padding: 10px 8px 4px;
      }
      .rl.sp {
        box-shadow: none;
        background: none;
        width: 22px;
      }

      /* lined index card */
      .lined > .paper > div {
        background:
          linear-gradient(90deg, transparent 70px, rgba(196, 70, 60, 0.55) 70px 74px, transparent 74px),
          repeating-linear-gradient(180deg, transparent 0 46px, rgba(70, 110, 170, 0.35) 46px 49px),
          var(--cream);
      }
      /* ticket */
      .ticket > .paper > div {
        background:
          radial-gradient(circle at 0 50%, var(--kraft) 0 26px, transparent 27px),
          radial-gradient(circle at 100% 50%, var(--kraft) 0 26px, transparent 27px),
          var(--terra);
      }
      .ticket .perf {
        position: absolute;
        top: 22px;
        bottom: 22px;
        left: 150px;
        border-left: 5px dotted rgba(243, 232, 210, 0.7);
      }
      /* hang tag */
      .tag .hole {
        position: absolute;
        left: 38px;
        top: 50%;
        width: 34px;
        height: 34px;
        margin-top: -17px;
        border-radius: 50%;
        background: var(--kraft-dark);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        z-index: 2;
      }
      /* crumpled note */
      .crumpled > .paper > div {
        background:
          linear-gradient(130deg, rgba(255, 255, 255, 0.25) 0 18%, transparent 18% 40%, rgba(0, 0, 0, 0.08) 40% 55%, transparent 55%),
          linear-gradient(40deg, transparent 0 30%, rgba(0, 0, 0, 0.1) 30% 33%, transparent 33% 70%, rgba(255, 255, 255, 0.2) 70%),
          var(--gray);
      }

      svg.doodle {
        position: absolute;
        overflow: visible;
        pointer-events: none;
      }
      #grain-top {
        position: absolute;
        inset: 0;
        filter: url(#grain);
        mix-blend-mode: multiply;
        opacity: 0.22;
        pointer-events: none;
      }
    </style>
  </head>

    <script>
      (function () {
        // ---- deterministic torn-paper silhouettes ----
        var seed = 0x51ed2701;
        function rnd() {
          seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
          return seed / 4294967296;
        }
        function torn(w, h, amp) {
          var pts = [];
          var sides = [
            [0, 0, 100, 0, 0, 1],
            [100, 0, 100, 100, -1, 0],
            [100, 100, 0, 100, 0, -1],
            [0, 100, 0, 0, 1, 0],
          ];
          sides.forEach(function (s) {
            var steps = Math.max(5, Math.round((s[4] === 0 ? w : h) / 45));
            for (var k = 0; k < steps; k++) {
              var t = (k === 0 ? 0 : k + (rnd() - 0.5) * 0.6) / steps;
              var d = (rnd() * 2 - 1) * amp;
              var px = s[0] + (s[2] - s[0]) * t + (s[4] * d * 100) / w;
              var py = s[1] + (s[3] - s[1]) * t + (s[5] * d * 100) / h;
              pts.push(px.toFixed(2) + "% " + py.toFixed(2) + "%");
            }
          });
          return "polygon(" + pts.join(",") + ")";
        }
        document.querySelectorAll(".scrap > .paper > div, .sheet .torn").forEach(function (el) {
          var box = el.closest(".scrap, .sheet");
          el.style.clipPath = torn(box.offsetWidth, box.offsetHeight, 9);
        });

        // ---- ransom-note title ----
        var paperBgs = ["#f3e8d2", "#2a1c14", "#b4502b", "#fffaf0", "#d9a441", "#2b2236"];
        var inkFor = { "#f3e8d2": "#2a1c14", "#2a1c14": "#f3e8d2", "#b4502b": "#f3e8d2", "#fffaf0": "#b4502b", "#d9a441": "#2a1c14", "#2b2236": "#d9a441" };
        var fonts = ['"Archivo Black"', '"Permanent Marker"', '"Space Mono"', '"Archivo Black"', "Oswald"];
        function ransom(lineId, text) {
          var line = document.getElementById(lineId);
          text.split("").forEach(function (ch) {
            var s = document.createElement("span");
            s.className = "rl" + (ch === " " ? " sp" : "");
            if (ch !== " ") {
              s.textContent = ch;
              var bg = paperBgs[Math.floor(rnd() * paperBgs.length)];
              s.style.background = bg;
              s.style.color = inkFor[bg];
              s.style.fontFamily = fonts[Math.floor(rnd() * fonts.length)];
              s.style.fontWeight = "700";
              s.dataset.rot = ((rnd() * 2 - 1) * 9).toFixed(1);
              s.dataset.dy = ((rnd() * 2 - 1) * 10).toFixed(1);
            }
            line.appendChild(s);
          });
        }
        ransom("rline-a", "¿QUÉ SON LOS");
        ransom("rline-b", "REGISTROS?");

        var tl = gsap.timeline({ paused: true });

        // ---- helpers ----
        function rotOf(el) {
          return parseFloat(el.dataset.rot || "0");
        }
        function slap(sel, t) {
          var el = document.querySelector(sel);
          var r = rotOf(el);
          tl.fromTo(el, { opacity: 0, scale: 1.3, rotation: r + 9 }, { opacity: 1, scale: 1, rotation: r, duration: 0.32, ease: "back.out(2.2)" }, t);
        }
        function rip(sel, t, dir) {
          var el = document.querySelector(sel);
          var r = rotOf(el);
          tl.to(el, { opacity: 0, y: -90 * (dir || 1), x: 60 * (dir || 1), rotation: r - 14, duration: 0.28, ease: "power2.in" }, t);
        }
        function pop(sel, t, to) {
          tl.fromTo(sel, { opacity: 0, scale: 0.2, rotation: -40 }, Object.assign({ opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, to || {}), t);
        }
        function out(sel, t) {
          tl.to(sel, { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in" }, t);
        }

        // ---- F1: la pregunta (0 - 3.15) ----
        var letters = document.querySelectorAll(".rl:not(.sp)");
        letters.forEach(function (s, i) {
          var r = parseFloat(s.dataset.rot);
          var dy = parseFloat(s.dataset.dy);
          tl.fromTo(s, { opacity: 0, scale: 1.8, rotation: r * 3, y: dy - 30 }, { opacity: 1, scale: 1, rotation: r, y: dy, duration: 0.18, ease: "steps(3)" }, 0.15 + i * 0.075);
        });
        tl.fromTo("#her-wrap", { opacity: 0, scale: 0.9, rotation: -3, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.8)" }, 0);
        tl.fromTo("#halo", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.05);
        tl.fromTo(["#sheet-cream", "#sheet-terra", "#sheet-night"], { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 0);
        tl.fromTo(["#tape-bg-a", "#tape-bg-b"], { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out", stagger: 0.1 }, 0.45);
        pop(["#bgstar-a", "#bgstar-b", "#bgstar-c", "#bgstar-d"], 0.6);
        // title shrinks into the page header
        tl.to("#title", { scale: 0.52, y: -128, transformOrigin: "50% 0%", duration: 0.5, ease: "power3.inOut" }, 3.0);

        // ---- F2: magia (3.15 - 8.4) ----
        slap("#note-some", 3.3);
        slap("#kw-magia", 5.15);
        pop("#mg-moon", 5.3);
        pop("#mg-s1", 5.4);
        pop("#mg-s2", 5.5);
        pop("#mg-s3", 5.6);
        slap("#note-others", 6.6);
        rip("#kw-magia", 8.25);
        out(["#mg-moon", "#mg-s1", "#mg-s2", "#mg-s3"], 8.25);
        rip("#note-some", 8.3, -1);
        rip("#note-others", 10.75);

        // ---- F3: entender (8.4 - 10.8) ----
        slap("#kw-entender", 8.5);
        tl.fromTo("#ent-underline path", { strokeDasharray: 800, strokeDashoffset: 800 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 8.95);
        rip("#kw-entender", 10.7);

        // ---- F4: coach + herramientas (10.8 - 16.87) ----
        slap("#kw-coach", 10.9);
        rip("#kw-coach", 12.25);
        slap("#kw-tools", 12.4);
        tl.fromTo("#tag-string", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 12.55);
        slap("#note-problem", 15.0);
        rip("#kw-tools", 16.75);
        out("#tag-string", 16.75);
        rip("#note-problem", 16.85, -1);

        // ---- F5: el camino (16.87 - 21.5) ----
        var reveal = document.getElementById("path-reveal");
        var len = reveal.getTotalLength();
        tl.fromTo(reveal, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 3.0, ease: "power1.inOut" }, 17.0);
        slap("#note-path", 17.6);
        slap("#kw-camino", 19.95);
        rip("#kw-camino", 21.35);
        rip("#note-path", 21.35, -1);
        tl.to("#path-svg", { opacity: 0, duration: 0.3 }, 21.35);

        // ---- F6: llega así → aliviada (21.5 - 25.5) ----
        slap("#note-arrive", 21.9);
        tl.fromTo("#cloud", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 22.1);
        slap("#kw-relief", 23.7);
        pop("#sun", 23.9);
        tl.to("#sun", { rotation: 90, duration: 1.6, ease: "none" }, 24.3);
        rip("#kw-relief", 25.4);
        out(["#sun", "#cloud"], 25.4);
        rip("#note-arrive", 25.4, -1);

        // ---- F7: cierre (25.5 - 29.9) ----
        ["#end-magia", "#end-entender", "#end-coach", "#end-camino", "#end-tools", "#end-relief"].forEach(function (sel, i) {
          slap(sel, 25.6 + i * 0.12);
        });
        slap("#end-note", 26.6);
        tl.fromTo("#stamp", { opacity: 0, scale: 1.8, rotation: -30 }, { opacity: 1, scale: 1, rotation: -12, duration: 0.22, ease: "power4.in" }, 28.3);

        // ---- ambient: halo breath + stepped twinkle (stop-motion feel) ----
        tl.fromTo("#halo", { scale: 1 }, { scale: 1.06, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 10, immediateRender: false }, 0.75);
        tl.fromTo(["#bgstar-a", "#bgstar-c"], { rotation: 0 }, { rotation: 72, duration: 6, ease: "steps(12)", repeat: 3, immediateRender: false }, 1.0);

        tl.set({}, {}, 29.9);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
