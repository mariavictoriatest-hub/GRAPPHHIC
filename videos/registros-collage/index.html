<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Abu Serif Condensed";
        src: url("assets/fonts/noto-serif-display-xcond-400.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Abu Serif Condensed";
        src: url("assets/fonts/noto-serif-display-xcond-600.woff2") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Abu Serif Condensed";
        src: url("assets/fonts/noto-serif-display-xcond-800.woff2") format("woff2");
        font-weight: 800;
      }
      :root {
        --cream: #fff6d2;
        --purple: #5e3c79;
        --lilac: #f7dbff;
        --white: #ffffff;
        --ink: #2b1d36;
        --gray: #dcd8de;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
        font-family: "Abu Serif Condensed", serif;
        font-stretch: 62.5%;
        color: var(--purple);
      }

      /* every element is a paper piece: .piece (scene motion) > .boil (stop-motion jitter) */
      .piece {
        position: absolute;
        opacity: 0;
      }
      .boil {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .cut {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 7px 8px rgba(43, 29, 54, 0.32));
      }
      /* torn paper strip carrying printed type */
      .strip {
        filter: drop-shadow(0 7px 9px rgba(43, 29, 54, 0.3));
      }
      .strip .paper {
        position: absolute;
        inset: 0;
        background: var(--p, var(--white));
      }
      .strip .txt {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 0.9;
        color: var(--c, var(--purple));
        white-space: nowrap;
      }
      .big {
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .small {
        font-weight: 400;
        font-style: normal;
        letter-spacing: 0.01em;
      }
      .label {
        font-family: "Space Mono", monospace;
        font-stretch: 100%;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* ransom-note letter cards */
      .rline {
        position: absolute;
        left: 0;
        width: 1080px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 4px;
      }
      .card {
        position: relative;
        opacity: 0;
        filter: drop-shadow(0 6px 7px rgba(43, 29, 54, 0.32));
      }
      .card > .paper {
        position: absolute;
        inset: 0;
      }
      .card > .ch {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .card > img {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* newsprint scraps */
      .news .paper {
        position: absolute;
        inset: 0;
        background: #f4f1ea;
        overflow: hidden;
      }
      .news .cols {
        position: absolute;
        inset: 14px 16px;
        column-count: 3;
        column-gap: 14px;
        font-family: "Abu Serif Condensed", serif;
        font-size: 17px;
        line-height: 1.12;
        color: #3a3640;
        text-align: justify;
      }

      #dots {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      #grain {
        position: absolute;
        inset: 0;
        filter: url(#grain-f);
        mix-blend-mode: multiply;
        opacity: 0.32;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29.9"
      data-width="1080"
      data-height="1920"
    >
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <defs>
          <filter id="grain-f" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="23" stitchTiles="stitch" />
            <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1" />
            <feComponentTransfer>
              <feFuncR type="linear" slope="0.5" intercept="0.6" />
              <feFuncG type="linear" slope="0.5" intercept="0.6" />
              <feFuncB type="linear" slope="0.5" intercept="0.6" />
            </feComponentTransfer>
          </filter>
        </defs>
      </svg>

      <audio id="voice" src="assets/voice.m4a" data-start="0" data-duration="29.9" data-track-index="1" data-volume="1"></audio>

      <!-- background paper patches -->
      <div class="piece strip" id="bg-lilac-a" style="left: -80px; top: 160px; width: 560px; height: 420px; --p: var(--lilac)">
        <div class="boil"><div class="paper torn"></div></div>
      </div>
      <div class="piece strip" id="bg-lilac-b" style="left: 620px; top: 1320px; width: 560px; height: 520px; --p: var(--lilac)">
        <div class="boil"><div class="paper torn"></div></div>
      </div>
      <div class="piece strip news" id="bg-news" style="left: 690px; top: 120px; width: 420px; height: 300px">
        <div class="boil"><div class="paper torn"><div class="cols"></div></div></div>
      </div>

      <!-- ransom title (becomes header) -->
      <div class="piece" id="title" style="left: 0; top: 300px; width: 1080px; height: 420px">
        <div class="boil">
          <div class="strip" id="q-strip" style="position: absolute; left: 330px; top: 0; width: 420px; height: 110px">
            <div class="paper torn" style="background: var(--purple)"></div>
            <div class="txt small" style="font-size: 78px; color: var(--cream)">¿qué son los</div>
          </div>
          <div class="rline" id="rline" style="top: 140px; height: 230px"></div>
        </div>
      </div>

      <!-- cutouts -->
      <div class="piece" id="book-open" style="left: 150px; top: 1080px; width: 780px"><div class="boil"><img class="cut" src="assets/cutouts/book-open.png" alt="" /></div></div>
      <div class="piece" id="moon" style="left: 690px; top: -60px; width: 460px"><div class="boil"><img class="cut" src="assets/cutouts/moon.png" alt="" /></div></div>
      <div class="piece" id="star-a" style="left: 60px; top: 820px; width: 230px"><div class="boil"><img class="cut" src="assets/cutouts/star.png" alt="" /></div></div>
      <div class="piece" id="star-b" style="left: 820px; top: 1180px; width: 170px"><div class="boil"><img class="cut" src="assets/cutouts/star.png" alt="" /></div></div>
      <div class="piece" id="star-c" style="left: 830px; top: 620px; width: 120px"><div class="boil"><img class="cut" src="assets/cutouts/star.png" alt="" /></div></div>
      <div class="piece" id="butterfly" style="left: 620px; top: 640px; width: 300px"><div class="boil"><img class="cut" src="assets/cutouts/butterfly.png" alt="" /></div></div>
      <div class="piece" id="books" style="left: 140px; top: 1000px; width: 820px"><div class="boil"><img class="cut" src="assets/cutouts/books-stack.png" alt="" /></div></div>
      <div class="piece" id="hourglass" style="left: 370px; top: 640px; width: 340px"><div class="boil"><img class="cut" src="assets/cutouts/hourglass.png" alt="" /></div></div>
      <div class="piece" id="flowers" style="left: -40px; top: 1260px; width: 700px"><div class="boil"><img class="cut" src="assets/cutouts/flowers-news.png" alt="" /></div></div>

      <svg id="dots" viewBox="0 0 1080 1920" aria-hidden="true">
        <path id="trail" d="M60 1640 C 260 1560, 160 1300, 380 1240 S 760 1300, 820 1060 S 520 820, 700 600" fill="none" stroke="#5e3c79" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 26" />
      </svg>

      <!-- text strips -->
      <div class="piece strip" id="t-algunos" style="left: 120px; top: 470px; width: 560px; height: 120px">
        <div class="boil"><div class="paper torn"></div><div class="txt small" style="font-size: 82px">para algunos es</div></div>
      </div>
      <div class="piece strip" id="t-magia" style="left: 130px; top: 1230px; width: 820px; height: 330px; --p: var(--purple)">
        <div class="boil"><div class="paper torn"></div><div class="txt big" style="font-size: 303px; color: var(--cream)">magia</div></div>
      </div>
      <div class="piece strip" id="t-otros" style="left: 520px; top: 1610px; width: 470px; height: 120px; --p: var(--lilac)">
        <div class="boil"><div class="paper torn"></div><div class="txt small" style="font-size: 87px">para otros…</div></div>
      </div>
      <div class="piece strip" id="t-entender" style="left: 90px; top: 560px; width: 900px; height: 250px">
        <div class="boil"><div class="paper torn"></div><div class="txt big" style="font-size: 225px">entender</div></div>
      </div>
      <div class="piece strip" id="t-comoun" style="left: 360px; top: 520px; width: 360px; height: 120px; --p: var(--lilac)">

      </div>
      <div class="piece" id="coach" style="left: 0; top: 680px; width: 1080px; height: 300px">
        <div class="boil"><div class="rline" id="rline-coach" style="top: 0; height: 300px"></div></div>
      </div>
      <div class="piece strip" id="t-herr" style="left: 40px; top: 620px; width: 1000px; height: 200px; --p: var(--purple)">
        <div class="boil"><div class="paper torn"></div><div class="txt big" style="font-size: 168px; color: var(--cream)">herramientas</div></div>
      </div>
      <div class="piece strip" id="t-resolver" style="left: 110px; top: 1000px; width: 860px; height: 120px; --p: var(--white)">
        <div class="boil"><div class="paper torn"></div><div class="txt label" style="font-size: 44px">para resolver un problema</div></div>
      </div>
      <div class="piece strip news" id="news-a" style="left: 600px; top: 1160px; width: 420px; height: 360px">
        <div class="boil"><div class="paper torn"><div class="cols"></div></div></div>
      </div>
      <div class="piece strip news" id="news-b" style="left: 50px; top: 360px; width: 360px; height: 240px">
        <div class="boil"><div class="paper torn"><div class="cols"></div></div></div>
      </div>
      <div class="piece strip" id="t-llevando" style="left: 80px; top: 1470px; width: 600px; height: 120px">
        <div class="boil"><div class="paper torn"></div><div class="txt small" style="font-size: 74px">nos van llevando…</div></div>
      </div>
      <div class="piece strip" id="t-camino" style="left: 90px; top: 380px; width: 900px; height: 290px; --p: var(--purple)">
        <div class="boil"><div class="paper torn"></div><div class="txt big" style="flex-direction: row; gap: 30px; color: var(--cream)"><span class="small" style="font-size: 110px">el</span><span style="font-size: 270px">camino</span></div></div>
      </div>
      <div class="piece strip" id="t-llega" style="left: 140px; top: 400px; width: 800px; height: 130px; --p: var(--gray)">
        <div class="boil"><div class="paper torn"></div><div class="txt small" style="font-size: 86px; color: var(--ink)">llega de una manera…</div></div>
      </div>
      <div class="piece strip" id="t-seva" style="left: 400px; top: 1180px; width: 280px; height: 120px; --p: var(--lilac)">
        <div class="boil"><div class="paper torn"></div><div class="txt small" style="font-size: 92px">se va</div></div>
      </div>
      <div class="piece strip" id="t-aliviada" style="left: 70px; top: 1310px; width: 940px; height: 290px">
        <div class="boil"><div class="paper torn"></div><div class="txt big" style="font-size: 266px">aliviada</div></div>
      </div>
      <div class="piece strip" id="t-espera" style="left: 150px; top: 800px; width: 780px; height: 150px">
        <div class="boil"><div class="paper torn"></div><div class="txt small" style="font-size: 119px">lo que te espera</div></div>
      </div>
      <div class="piece strip" id="t-bueno" style="left: 60px; top: 970px; width: 960px; height: 240px; --p: var(--purple)">
        <div class="boil"><div class="paper torn"></div><div class="txt big" style="font-size: 205px; color: var(--cream)">está bueno</div></div>
      </div>
      <div class="piece strip" id="t-handle" style="left: 560px; top: 1560px; width: 440px; height: 84px; --p: var(--white)">
        <div class="boil"><div class="paper torn"></div><div class="txt label" style="font-size: 32px">@abuchaljacoach</div></div>
      </div>

      <div id="grain" aria-hidden="true"></div>
    </div>

    <script>
      (function () {
        var FPS = 12;
        var seed = 0x2f6a91c3;
        function rnd() {
          seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
          return seed / 4294967296;
        }
        function hash(n) {
          var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        }
        function torn(w, h, amp) {
          var pts = [];
          var sides = [
            [0, 0, 100, 0, 0, 1],
            [100, 0, 100, 100, -1, 0],
            [100, 100, 0, 100, 0, -1],
            [0, 100, 0, 0, 1, 0],
          ];
          sides.forEach(function (s) {
            var steps = Math.max(5, Math.round((s[4] === 0 ? w : h) / 28));
            for (var k = 0; k < steps; k++) {
              var t = (k === 0 ? 0 : k + (rnd() - 0.5) * 0.7) / steps;
              var d = rnd() * amp;
              var px = s[0] + (s[2] - s[0]) * t + (s[4] * d * 100) / w;
              var py = s[1] + (s[3] - s[1]) * t + (s[5] * d * 100) / h;
              pts.push(px.toFixed(2) + "% " + py.toFixed(2) + "%");
            }
          });
          return "polygon(" + pts.join(",") + ")";
        }

        // newsprint filler text
        var NEWS =
          "El registro de cada alma guarda memoria de su camino. Quienes llegan a una sesión buscan comprender lo que viven, ordenar lo que sienten y encontrar herramientas para seguir. La consulta se realiza con calma, en un espacio de escucha, y cada encuentro es distinto. Muchas personas describen la experiencia como un alivio, una luz que permite mirar con otros ojos aquello que parecía un problema. ";
        document.querySelectorAll(".news .cols").forEach(function (c) {
          c.textContent = NEWS + NEWS + NEWS;
        });

        // ransom cards
        var cardPapers = [
          ["#f7dbff", "#2b1d36"],
          ["#ffffff", "#5e3c79"],
          ["#dcd8de", "#2b1d36"],
          ["#5e3c79", "#fff6d2"],
          ["#fff6d2", "#5e3c79"],
          ["#f4f1ea", "#2b1d36"],
        ];
        function ransom(lineId, text, size, realMap) {
          var line = document.getElementById(lineId);
          var used = {};
          text.split("").forEach(function (ch, i) {
            var card = document.createElement("div");
            card.className = "card";
            var real = realMap && realMap[ch] && !used[ch];
            var w = Math.round(size * (real ? 0.78 : 0.62 + rnd() * 0.18));
            var h = Math.round(size * (0.92 + rnd() * 0.16));
            card.style.width = w + "px";
            card.style.height = h + "px";
            if (real) {
              used[ch] = true;
              var img = document.createElement("img");
              img.src = realMap[ch];
              img.alt = "";
              card.appendChild(img);
            } else {
              var pp = cardPapers[Math.floor(rnd() * cardPapers.length)];
              var paper = document.createElement("div");
              paper.className = "paper";
              paper.style.background = pp[0];
              paper.style.clipPath = torn(w, h, 2.2);
              var c = document.createElement("div");
              c.className = "ch";
              c.textContent = ch;
              c.style.color = pp[1];
              c.style.fontSize = Math.round(size * (0.7 + rnd() * 0.18)) + "px";
              c.style.fontWeight = String([400, 600, 800][Math.floor(rnd() * 3)]);
              
              card.appendChild(paper);
              card.appendChild(c);
            }
            card.dataset.rot = ((rnd() * 2 - 1) * 8).toFixed(1);
            card.dataset.dy = ((rnd() * 2 - 1) * 12).toFixed(1);
            line.appendChild(card);
          });
          return line.querySelectorAll(".card");
        }
        var titleCards = ransom("rline", "REGISTROS?", 200, { S: "assets/cutouts/letter-s.png" });
        var coachCards = ransom("rline-coach", "COACH", 270, { C: "assets/cutouts/letter-c.png" });

        document.querySelectorAll(".torn").forEach(function (el) {
          var box = el.closest(".piece, .strip");
          el.style.clipPath = torn(box.offsetWidth, box.offsetHeight, 2.4);
        });

        // ---- authored choreography (continuous time; sampled on the 12 fps grid below) ----
        var inner = gsap.timeline({ paused: true });
        function rot(el) {
          return parseFloat((el.dataset && el.dataset.rot) || "0");
        }
        // slap: a hand drops the paper on the table
        function slap(sel, t, r) {
          gsap.utils.toArray(sel).forEach(function (el) {
            var rr = r === undefined ? rot(el) : r;
            inner.fromTo(el, { opacity: 0, scale: 1.18, rotation: rr - 6, y: -40 }, { opacity: 1, scale: 1, rotation: rr, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
          });
        }
        // slide: the paper is pushed off the table
        function slide(sel, t, dx, dy) {
          inner.to(sel, { x: dx, y: dy, rotation: "+=" + (dx > 0 ? 14 : -14), duration: 0.5, ease: "power1.in" }, t);
          inner.set(sel, { opacity: 0 }, t + 0.5);
        }
        function enter(sel, t, fx, fy, r) {
          inner.fromTo(sel, { opacity: 1, x: fx, y: fy, rotation: (r || 0) - 10 }, { x: 0, y: 0, rotation: r || 0, duration: 0.6, ease: "power2.out", immediateRender: false }, t);
        }
        gsap.set(".piece", { opacity: 0 });
        gsap.set(".card", { opacity: 0 });

        // F0 background
        slap("#bg-lilac-a", 0, -4);
        slap("#bg-lilac-b", 0.08, 5);
        slap("#bg-news", 0.16, 7);

        // F1 ¿qué son los registros? (0 - 3.15)
        slap("#title", 0.2, 0);
        inner.fromTo("#q-strip", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.25);
        titleCards.forEach(function (c, i) {
          inner.fromTo(c, { opacity: 0, scale: 1.5, rotation: rot(c) * 3, y: -60 }, { opacity: 1, scale: 1, rotation: rot(c), y: parseFloat(c.dataset.dy), duration: 0.17, ease: "power2.out", immediateRender: false }, 0.45 + i * 0.11);
        });
        enter("#book-open", 1.6, 0, 900, -3);
        enter("#moon", 2.0, 500, -300, 0);
        // title becomes the page header
        inner.to("#title", { y: -235, scale: 0.5, transformOrigin: "50% 0%", duration: 0.5, ease: "power2.inOut" }, 3.0);
        inner.to("#bg-news", { y: -500, duration: 0.5, ease: "power1.in" }, 3.0);

        // F2 magia (3.15 - 8.4)
        slide("#book-open", 3.1, 0, 1000);
        slap("#t-algunos", 3.3, -3);
        inner.to("#moon", { x: -380, y: 710, scale: 1.5, rotation: -8, duration: 1.4, ease: "power2.inOut" }, 3.4);
        slap("#t-magia", 5.1, -4);
        slap("#star-a", 5.25, -12);
        slap("#star-b", 5.4, 18);
        slap("#star-c", 5.55, 4);
        enter("#butterfly", 5.9, 600, -200, 12);
        slap("#t-otros", 6.6, 5);
        slide(["#t-magia", "#star-a", "#star-b", "#star-c"], 8.2, -1200, 0);
        slide(["#moon", "#butterfly"], 8.25, 1200, -300);
        slide("#t-algunos", 8.3, -1200, 0);

        // F3 entender (8.4 - 10.8)
        enter("#books", 8.45, 0, 1000, 2);
        slap("#t-entender", 8.6, 3);
        slide("#t-otros", 10.6, 1200, 0);
        slide(["#t-entender", "#books"], 10.65, 0, 1300);

        // F4 coach + herramientas (10.8 - 16.87)
        slap("#t-comoun", 10.85, -2);
        inner.set("#coach", { opacity: 1 }, 10.9);
        coachCards.forEach(function (c, i) {
          inner.fromTo(c, { opacity: 0, scale: 1.5, rotation: rot(c) * 3, y: -60 }, { opacity: 1, scale: 1, rotation: rot(c), y: parseFloat(c.dataset.dy), duration: 0.17, ease: "power2.out", immediateRender: false }, 11.0 + i * 0.12);
        });
        slide(["#coach", "#t-comoun"], 12.2, 1200, 0);
        slap("#news-b", 12.35, -6);
        slap("#news-a", 12.45, 8);
        slap("#t-herr", 12.55, -2);
        slap("#t-resolver", 15.0, 2);
        slide(["#t-herr", "#news-b"], 16.7, -1200, 0);
        slide(["#t-resolver", "#news-a"], 16.75, 1200, 0);

        // F5 el camino (16.87 - 21.5)
        var trail = document.getElementById("trail");
        var L = trail.getTotalLength();
        // dotted path is revealed by growing a dash window; dots stay crisp
        var prog = { p: 0 };
        gsap.set("#dots", { opacity: 0 });
        inner.set("#dots", { opacity: 1 }, 16.95);
        inner.fromTo(
          prog,
          { p: 0 },
          {
            p: 1,
            duration: 3.0,
            ease: "power1.inOut",
            immediateRender: false,
            onUpdate: function () {
              var len = L * prog.p;
              trail.style.strokeDasharray = len > 0 ? buildDash(len) : "0 " + (L + 1);
              var pt = trail.getPointAtLength(Math.max(0.01, len));
              var pt2 = trail.getPointAtLength(Math.min(L, len + 12));
              var ang = (Math.atan2(pt2.y - pt.y, pt2.x - pt.x) * 180) / Math.PI;
              gsap.set("#butterfly", { x: pt.x - 770, y: pt.y - 740, rotation: ang * 0.25, scale: 0.8 });
            },
          },
          17.0,
        );
        function buildDash(len) {
          var n = Math.floor(len / 27);
          var arr = [];
          for (var i = 0; i < n; i++) arr.push(1, 26);
          arr.push(0, L + 50);
          return arr.join(" ");
        }
        inner.set("#butterfly", { opacity: 1 }, 17.0);
        slap("#t-llevando", 17.6, -3);
        slap("#t-camino", 19.95, 3);
        slide(["#t-camino", "#t-llevando"], 21.3, -1200, 0);
        inner.to(["#dots", "#butterfly"], { opacity: 0, duration: 0.2 }, 21.35);

        // F6 llega así → aliviada (21.5 - 25.5)
        enter("#hourglass", 21.55, 0, -1100, 0);
        slap("#t-llega", 21.9, -2);
        inner.to("#hourglass", { rotation: 180, duration: 0.6, ease: "power2.inOut" }, 23.2);
        slap("#t-seva", 23.6, -5);
        slap("#t-aliviada", 23.75, 2);
        inner.fromTo("#flowers", { opacity: 1, scale: 0.2, transformOrigin: "0% 100%" }, { scale: 1, duration: 0.9, ease: "back.out(1.6)", immediateRender: false }, 23.9);
        slide(["#t-llega", "#hourglass"], 25.3, 1200, 0);
        slide(["#t-seva", "#t-aliviada"], 25.35, -1200, 0);

        // F7 lo que te espera está bueno (25.5 - 29.9)
        inner.fromTo("#moon", { opacity: 1, x: 0, y: -400, scale: 1, rotation: 0 }, { y: 300, duration: 0.6, ease: "power2.out", immediateRender: false }, 25.5);
        inner.fromTo("#butterfly", { opacity: 1, x: -900, y: -600, scale: 0.75, rotation: 0 }, { x: -520, y: -310, rotation: -10, duration: 0.6, ease: "power2.out", immediateRender: false }, 25.7);
        slap("#t-espera", 25.8, -2);
        inner.fromTo("#star-a", { opacity: 1, x: 760, y: -560, rotation: 0, scale: 0.7 }, { opacity: 1, duration: 0.01, immediateRender: false }, 26.2);
        inner.fromTo("#books", { opacity: 1, x: 300, y: 1000, rotation: -6, scale: 0.6 }, { y: 520, duration: 0.5, ease: "power2.out", immediateRender: false }, 26.4);
        slap("#t-bueno", 27.9, -3);
        slap("#t-handle", 28.6, 3);

        // ---- stop-motion law: quantize to the 12 fps grid, then boil every piece on 2s ----
        var boils = Array.prototype.slice.call(document.querySelectorAll(".boil"));
        function applyTime(t) {
          var step = Math.floor(t * FPS + 1e-6);
          inner.seek(step / FPS, false);
          var b = Math.floor(step / 2);
          for (var i = 0; i < boils.length; i++) {
            var amp = 1;
            gsap.set(boils[i], {
              x: (hash(b * 13 + i * 101) - 0.5) * 5 * amp,
              y: (hash(b * 29 + i * 211) - 0.5) * 5 * amp,
              rotation: (hash(b * 47 + i * 331) - 0.5) * 1.4 * amp,
            });
          }
        }
        var tl = gsap.timeline({
          paused: true,
          onUpdate: function () {
            applyTime(tl.time());
          },
        });
        tl.to({ p: 0 }, { p: 1, duration: 29.9, ease: "none" }, 0);
        tl.seek(0);
        applyTime(0);
        window.__timelines["main"] = tl;
      })();
    </script>
