<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #BEEBEF; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="2.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="likes" data-composition-id="likes" data-composition-src="compositions/likes.html" data-start="2.7" data-duration="1.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="metrics" data-composition-id="metrics" data-composition-src="compositions/metrics.html" data-start="4.4" data-duration="5.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="vanity" data-composition-id="vanity" data-composition-src="compositions/vanity.html" data-start="9.7" data-duration="2.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="12.3" data-duration="2.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
